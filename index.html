<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>攒小米 · 日常记录</title>
  <meta name="description" content="一个安静、轻盈的个人记录空间。" />
  <style>
    :root {
      --bg: #eef5ef;
      --paper: #fbfdf9;
      --paper-2: #f4faf5;
      --ink: #26352d;
      --ink-soft: #66766d;
      --ink-faint: #98a69d;
      --line: #dce8df;
      --line-strong: #c8d9cd;
      --accent: #4f8a67;
      --accent-deep: #346c50;
      --accent-wash: #e2f0e6;
      --olive: #78956e;
      --blue: #6d8e8d;
      --violet: #7f967f;
      --cat-reading: #4f8a67;
      --cat-life: #78956e;
      --cat-work: #63898b;
      --cat-invest: #9b9c68;
      --cat-art: #6f9a83;
      --cat-film: #5b8c83;
      --shadow: 0 18px 45px rgba(53, 45, 31, .07);
      --shadow-soft: 0 8px 24px rgba(53, 45, 31, .05);
      --radius: 18px;
      --radius-sm: 12px;
    }
    html[data-theme="dark"] {
      --bg: #202a23;
      --paper: #28332b;
      --paper-2: #303d34;
      --ink: #edf5ee;
      --ink-soft: #b8c9bd;
      --ink-faint: #7e9183;
      --line: #3e5044;
      --line-strong: #506456;
      --accent: #84b997;
      --accent-deep: #9dcca9;
      --accent-wash: #2c4936;
      --olive: #9dbb91;
      --blue: #91b4b0;
      --violet: #a4bca5;
      --cat-reading: #84b997;
      --cat-life: #9dbb91;
      --cat-work: #91b4b0;
      --cat-invest: #c2bd7d;
      --cat-art: #93c4a8;
      --cat-film: #83b7aa;
      --shadow: 0 18px 45px rgba(0, 0, 0, .19);
      --shadow-soft: 0 8px 24px rgba(0, 0, 0, .14);
    }
    * { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 9% 8%, rgba(101, 164, 119, .10), transparent 22rem),
        radial-gradient(circle at 88% 14%, rgba(133, 177, 144, .12), transparent 25rem),
        var(--bg);
      font-family: "YouYuan", "幼圆", "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
      letter-spacing: .01em;
      transition: background .25s ease, color .25s ease;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .app-shell { height: 100%; display: flex; flex-direction: column; }
    .brand-mark { width: 30px; height: 30px; display: block; object-fit: contain; user-select: none; -webkit-user-drag: none; }
    .brand-title { font-family: "YouYuan", "幼圆", sans-serif; font-size: 19px; letter-spacing: .08em; }
    .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .topbar {
      flex: none;
      height: 72px; padding: 0 42px; display: flex; align-items: center; gap: 20px;
      border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 83%, transparent);
      backdrop-filter: blur(14px); position: sticky; top: 0; z-index: 5;
    }
    .topbar-brand { display: flex; align-items: center; gap: 10px; margin-right: 7px; }
    .topbar-brand .brand-mark { width: 30px; height: 30px; }
    .topbar-brand .brand-title { font-family: "YouYuan", "幼圆", sans-serif; font-size: 18px; letter-spacing: .08em; }
    .crumb { color: var(--ink-faint); font-size: 12px; white-space: nowrap; }
    .crumb strong { color: var(--ink-soft); font-weight: 500; }
    .top-actions { display: flex; align-items: center; gap: 9px; margin-left: auto; }
    .search {
      width: min(244px, 25vw); height: 36px; border: 1px solid var(--line); border-radius: 10px;
      color: var(--ink); background: var(--paper); padding: 0 13px 0 34px; outline: none;
      font-size: 12px; transition: .2s ease;
    }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
    .search-wrap { position: relative; }
    .search-mark { position: absolute; left: 12px; top: 9px; color: var(--ink-faint); font-size: 15px; pointer-events: none; }
    .icon-button {
      width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 10px;
      background: var(--paper); color: var(--ink-soft); display: grid; place-items: center;
      transition: .2s ease;
    }
    .icon-button:hover { color: var(--ink); border-color: var(--line-strong); background: var(--paper-2); }
    .primary-button {
      height: 36px; padding: 0 15px; border-radius: 10px; border: 0;
      background: var(--ink); color: var(--paper); font-size: 12px; font-weight: 600;
      box-shadow: 0 7px 15px rgba(36, 35, 31, .12); transition: .2s ease;
    }
    .primary-button:hover { transform: translateY(-1px); background: var(--accent-deep); }
    .page { flex: 1; min-height: 0; width: 100%; max-width: 1430px; padding: 26px 42px 24px; margin: 0 auto; display: flex; flex-direction: column; }
    .overview { flex: none; display: grid; grid-template-columns: minmax(150px, .46fr) minmax(320px, 1.5fr) minmax(200px, .62fr); gap: 14px; margin-bottom: 16px; align-items: stretch; }
    .date-card { min-height: 148px; padding: 19px 21px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: var(--shadow-soft); display: flex; flex-direction: column; justify-content: center; gap: 9px; }
    .date-weekday { color: var(--ink-soft); font-size: 12px; }
    .date-note { display: flex; align-items: baseline; gap: 10px; }
    .date-note .date-big { color: var(--ink); font-family: "YouYuan", "幼圆", sans-serif; font-size: 40px; line-height: 1; }
    .date-note .date-small { color: var(--ink-faint); font-size: 11px; }
    .explore-panel { min-height: 148px; overflow: hidden; }
    .explore-panel .panel-head { padding: 16px 19px 9px; }
    .explore-panel .panel-title { font-size: 17px; }
    .small-add { border: 0; background: transparent; color: var(--accent); font-size: 20px; line-height: 1; padding: 1px 0; }
    .small-add:hover { color: var(--accent-deep); }
    .exploration-list { padding: 0 19px 12px; max-height: 100px; overflow-y: auto; }
    .explore-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
    .explore-item:first-child { border-top: 0; }
    .explore-bullet { width: 6px; height: 6px; flex: 0 0 6px; border-radius: 50%; background: var(--accent); }
    .explore-text { flex: 1; min-width: 0; color: var(--ink-soft); font-size: 12px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .explore-actions { display: flex; gap: 2px; opacity: .45; transition: .2s ease; }
    .explore-item:hover .explore-actions { opacity: 1; }
    .explore-action { border: 0; background: transparent; color: var(--ink-faint); padding: 2px 4px; font-size: 11px; }
    .explore-action:hover { color: var(--accent); }
    .explore-empty { color: var(--ink-faint); font-size: 11px; padding: 8px 0; }
    .stats-panel { min-height: 148px; padding: 20px; display: flex; align-items: center; justify-content: space-around; gap: 12px; }
    .stat-compact { display: flex; flex-direction: column; gap: 9px; }
    .stat-label { color: var(--ink-faint); font-size: 11px; }
    .stat-number { color: var(--ink); font-family: "YouYuan", "幼圆", sans-serif; font-size: 27px; font-weight: 500; }
    .stat-divider { width: 1px; height: 40px; background: var(--line); }
    .records-panel { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
    .records-bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .records-meta { display: flex; align-items: center; gap: 14px; margin-left: auto; }
    .panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: var(--shadow-soft); }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
    .panel-title { margin: 0; font-family: "YouYuan", "幼圆", sans-serif; font-size: 19px; font-weight: 500; letter-spacing: -.02em; }
    .panel-meta { color: var(--ink-faint); font-size: 11px; }
    .filters { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .filter-chip {
      border: 1px solid var(--line); border-radius: 99px; background: transparent; color: var(--ink-soft);
      font-size: 11px; padding: 5px 11px; transition: .2s ease; white-space: nowrap;
    }
    .filter-chip:hover { border-color: var(--line-strong); color: var(--ink); }
    .filter-chip.active { border-color: var(--accent); color: var(--accent-deep); background: var(--accent-wash); }
    .sort-select { border: 0; outline: none; background: transparent; color: var(--ink-faint); font-size: 11px; cursor: pointer; }
    .notes-grid { flex: 1; min-height: 0; padding: 15px 18px 17px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: clamp(148px, calc((100% - 12px) / 2), 200px); align-content: start; gap: 12px; overflow-y: auto; overscroll-behavior: contain; }
    .notes-grid::-webkit-scrollbar, .exploration-list::-webkit-scrollbar, .reader-body::-webkit-scrollbar, .editor-body::-webkit-scrollbar { width: 8px; }
    .notes-grid::-webkit-scrollbar-thumb, .exploration-list::-webkit-scrollbar-thumb, .reader-body::-webkit-scrollbar-thumb, .editor-body::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 99px; border: 2px solid var(--paper); }
    .notes-grid::-webkit-scrollbar-track, .exploration-list::-webkit-scrollbar-track, .reader-body::-webkit-scrollbar-track, .editor-body::-webkit-scrollbar-track { background: transparent; }
    .note-card {
      position: relative; height: 100%; padding: 13px 15px 12px; border: 1px solid var(--line);
      border-radius: 14px; background: var(--paper); transition: .22s ease; cursor: pointer; display: flex; flex-direction: column; overflow: hidden;
    }
    .note-card:hover { border-color: var(--line-strong); box-shadow: 0 11px 24px rgba(57, 49, 38, .07); transform: translateY(-2px); }
    .note-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 16px; }
    .note-category { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-faint); font-size: 10px; line-height: 1.4; }
    .note-category i { width: 5px; height: 5px; border-radius: 50%; display: inline-block; background: var(--category-color, var(--accent)); }
    .favorite { border: 0; background: transparent; color: var(--line-strong); padding: 0; font-size: 15px; line-height: 1; transition: .2s ease; }
    .favorite:hover, .favorite.on { color: var(--accent); }
    .note-title { margin: 9px 0 5px; font-size: 14.5px; line-height: 1.4; font-weight: 600; letter-spacing: -.01em; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .note-excerpt { color: var(--ink-soft); font-size: 12px; line-height: 1.6; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
    .note-bottom { display: flex; align-items: center; gap: 8px; padding-top: 9px; margin-top: auto; }
    .note-date { color: var(--ink-faint); font-size: 10px; flex: none; }
    .tag-row { display: flex; gap: 4px; margin-left: auto; overflow: hidden; }
    .tag { color: var(--ink-soft); background: var(--paper-2); border-radius: 4px; padding: 3px 6px; font-size: 9px; }
    .empty-state { padding: 50px 20px 62px; text-align: center; color: var(--ink-faint); grid-column: 1 / -1; }
    .empty-symbol { display: block; color: var(--accent); font-family: "YouYuan", "幼圆", sans-serif; font-size: 35px; margin-bottom: 12px; }
    .empty-state p { margin: 0; font-size: 12px; line-height: 1.8; }
    .explore-backdrop { position: fixed; inset: 0; z-index: 15; background: rgba(32, 28, 22, .27); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
    .explore-backdrop.show { opacity: 1; pointer-events: auto; }
    .explore-modal { position: fixed; z-index: 16; left: 50%; top: 50%; width: min(460px, calc(100vw - 32px)); transform: translate(-50%, -46%) scale(.97); opacity: 0; visibility: hidden; pointer-events: none; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); transition: .25s ease; }
    .explore-modal.show { opacity: 1; visibility: visible; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .explore-modal-head { padding: 22px 23px 17px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: space-between; }
    .explore-modal h2 { margin: 0; font-family: "YouYuan", "幼圆", sans-serif; font-size: 22px; font-weight: 500; }
    .explore-modal form { padding: 21px 23px 22px; }
    .explore-input { display: block; width: 100%; min-height: 116px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; outline: none; color: var(--ink); background: var(--paper-2); padding: 11px 12px; font-size: 13px; line-height: 1.75; }
    .explore-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
    .explore-modal-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
    .drawer-backdrop { position: fixed; inset: 0; z-index: 10; background: rgba(32, 28, 22, .27); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
    .drawer-backdrop.show { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; right: 0; top: 0; z-index: 11; width: min(760px, 100vw); height: 100vh; height: 100dvh;
      background: var(--paper); box-shadow: -18px 0 55px rgba(32, 26, 18, .13); transform: translateX(100%);
      visibility: hidden;
      transition: transform .3s cubic-bezier(.22,.61,.36,1), visibility .3s; display: flex; flex-direction: column;
    }
    .drawer.show { transform: translateX(0); visibility: visible; }
    .drawer-close { border: 0; background: transparent; color: var(--ink-faint); font-size: 22px; line-height: 1; padding: 2px; }
    .drawer-close:hover { color: var(--ink); }
    .reader-head { flex: none; padding: 19px 34px 15px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .reader-meta { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .reader-category { display: inline-flex; align-items: center; gap: 6px; color: var(--accent-deep); background: var(--accent-wash); border-radius: 99px; padding: 4px 12px; font-size: 11px; white-space: nowrap; }
    .reader-category i { width: 6px; height: 6px; border-radius: 50%; background: var(--category-color, var(--accent)); }
    .reader-date { color: var(--ink-faint); font-size: 11px; white-space: nowrap; }
    .reader-body { flex: 1; min-height: 0; overflow-y: auto; padding: 30px 34px 36px; }
    .reader-title { margin: 0 0 13px; font-family: "YouYuan", "幼圆", sans-serif; font-size: 25px; line-height: 1.5; font-weight: 600; letter-spacing: -.01em; }
    .reader-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
    .reader-tags:empty { display: none; }
    .reader-tags .tag { padding: 4px 10px; font-size: 10px; border-radius: 6px; }
    .reader-content { color: var(--ink); font-size: 15px; line-height: 2.05; word-break: break-word; }
    .reader-content p { margin: 0 0 .95em; }
    .reader-content p:last-child { margin-bottom: 0; }
    .reader-foot { flex: none; padding: 14px 34px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
    .reader-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .ghost-button { border: 1px solid var(--line); background: transparent; color: var(--ink-soft); border-radius: 9px; padding: 9px 16px; font-size: 12px; transition: .2s ease; }
    .ghost-button:hover { border-color: var(--accent); color: var(--accent-deep); }
    .ghost-button.on { border-color: var(--accent); color: var(--accent-deep); background: var(--accent-wash); }
    .modal-backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(32, 28, 22, .34); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
    .modal-backdrop.show { opacity: 1; pointer-events: auto; }
    .editor-modal {
      position: fixed; z-index: 21; left: 50%; top: 50%; width: min(1080px, calc(100vw - 72px));
      height: min(860px, calc(100vh - 56px)); height: min(860px, calc(100dvh - 56px));
      transform: translate(-50%, -46%) scale(.98); opacity: 0; visibility: hidden; pointer-events: none;
      background: var(--paper); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; overflow: hidden; transition: .25s ease;
    }
    .editor-modal.show { opacity: 1; visibility: visible; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .editor-title-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .editor-title-row .title-input { flex: 1; min-width: 0; }
    .editor-title-row .drawer-close { flex: none; width: 34px; height: 34px; border-radius: 50%; font-size: 19px; }
    .editor-title-row .drawer-close:hover { background: var(--paper-2); }
    #entryForm { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .editor-body { flex: 1; min-height: 0; overflow-y: auto; padding: 26px 30px 16px; display: flex; flex-direction: column; }
    .editor-foot { flex: none; padding: 15px 30px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
    .editor-foot .save-button { margin-left: auto; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; color: var(--ink-soft); font-size: 11px; margin-bottom: 8px; }
    .form-input, .form-textarea, .form-select {
      width: 100%; border: 1px solid var(--line); border-radius: 10px; outline: none; color: var(--ink);
      background: var(--paper-2); padding: 11px 12px; font-size: 13px; transition: .2s ease;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
    .form-input.title-input { padding: 13px 12px; font-family: "YouYuan", "幼圆", sans-serif; font-size: 20px; background: var(--paper); }
    .form-textarea { min-height: 245px; resize: vertical; line-height: 1.9; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-row.three { grid-template-columns: 1fr 1fr 1.35fr; }
    .content-group { flex: 1; min-height: 172px; margin-bottom: 0; display: flex; flex-direction: column; }
    .content-group .form-textarea { flex: 1; min-height: 0; resize: none; }
    .form-hint { color: var(--ink-faint); font-size: 10px; margin-top: 7px; display: flex; justify-content: space-between; }
    .text-button { border: 0; background: transparent; color: var(--ink-faint); padding: 8px 0; font-size: 11px; }
    .text-button:hover { color: var(--accent); }
    .save-button { border: 0; background: var(--accent); color: #fff; border-radius: 9px; padding: 10px 21px; font-size: 12px; font-weight: 600; }
    .save-button:hover { background: var(--accent-deep); }
    .toast {
      position: fixed; z-index: 30; left: 50%; bottom: 26px; transform: translate(-50%, 15px);
      color: #fff; background: var(--ink); padding: 10px 15px; border-radius: 9px; font-size: 11px;
      opacity: 0; pointer-events: none; transition: .25s ease; box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .account-button {
      height: 36px; padding: 0 13px; border: 1px solid var(--line); border-radius: 10px;
      background: var(--paper); color: var(--ink-soft); font-size: 12px; white-space: nowrap; transition: .2s ease;
    }
    .account-button:hover { color: var(--ink); border-color: var(--line-strong); background: var(--paper-2); }
    .account-button[data-state="syncing"] { color: var(--accent-deep); border-color: var(--accent); }
    .account-button[data-state="error"] { color: #b4543f; border-color: #dcae9f; }
    html[data-theme="dark"] .account-button[data-state="error"] { color: #e6ac9c; border-color: #6d4b41; }
    .auth-modal {
      position: fixed; z-index: 21; left: 50%; top: 50%; width: min(420px, calc(100vw - 32px));
      transform: translate(-50%, -46%) scale(.98); opacity: 0; visibility: hidden; pointer-events: none;
      background: var(--paper); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
      transition: .25s ease;
    }
    .auth-modal.show { opacity: 1; visibility: visible; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .auth-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .auth-head h2 { margin: 0; font-family: "YouYuan", "幼圆", sans-serif; font-size: 18px; font-weight: 500; }
    .auth-body { padding: 20px 24px 22px; }
    .auth-body .form-input { margin-bottom: 15px; }
    .auth-hint { color: var(--ink-faint); font-size: 11px; line-height: 1.8; margin: 3px 0 16px; min-height: 38px; }
    .auth-foot { display: flex; align-items: center; gap: 10px; }
    .auth-foot .save-button { margin-left: auto; }
    @media (max-width: 1080px) {
      .topbar, .page { padding-left: 28px; padding-right: 28px; }
    }
    @media (max-width: 790px) {
      body { height: auto; overflow-y: auto; }
      .app-shell { height: auto; }
      .page { flex: none; }
      .records-panel { flex: none; }
      .topbar { height: 65px; padding: 0 17px; gap: 10px; }
      .topbar-brand .brand-title { display: none; }
      .crumb { display: none; }
      .search-wrap { flex: 1; }
      .search { width: 100%; }
      .top-actions { gap: 5px; }
      .primary-button { padding: 0 11px; font-size: 11px; }
      .page { padding: 29px 17px 45px; }
      .overview { grid-template-columns: 1fr; gap: 10px; }
      .date-card { min-height: 112px; }
      .explore-panel, .stats-panel { min-height: 0; }
      .exploration-list { max-height: 100px; }
      .stats-panel { padding: 16px 20px; justify-content: flex-start; }
      .records-bar { padding: 12px 15px; gap: 10px; }
      .records-meta { width: 100%; justify-content: space-between; }
      .notes-grid { flex: none; grid-template-columns: 1fr; grid-auto-rows: auto; max-height: 62vh; padding: 13px 15px 15px; }
      .reader-head, .reader-body, .reader-foot { padding-left: 20px; padding-right: 20px; }
      .reader-title { font-size: 21px; }
      .editor-modal { width: calc(100vw - 24px); height: calc(100vh - 32px); height: calc(100dvh - 32px); border-radius: 16px; }
      .editor-body, .editor-foot { padding-left: 20px; padding-right: 20px; }
      .form-row.three { grid-template-columns: 1fr; }
    }
    @media (max-width: 460px) {
      .top-actions .icon-button.theme-toggle { display: none; }
    }
  </style>

          { id: uid(), seed: true, title: "在安静里，重新听见自己", category: "life", date: "2026-10-02", content: "今天下班后没有立刻打开任何东西，只是沿着河边慢慢走。风把树叶翻到另一面，城市忽然有了很具体的呼吸。原来留白不是浪费，它让一些被忽略的感受重新浮上来。", tags: ["散步", "慢生活"], favorite: true, updatedAt: Date.now() - 3600000 },
          { id: uid(), seed: true, title: "读《悉达多》：河流知道答案", category: "reading", date: "2026-10-01", content: "读到河流的段落时想到，很多答案并不是被找到的，而是在一次次经过之后，慢慢变得清晰。阅读有时像借来另一双眼睛，看见自己生活里的水流。", tags: ["小说", "自我"], favorite: true, updatedAt: Date.now() - 86400000 },
          { id: uid(), seed: true, title: "《完美的日子》：重复里的光", category: "film", date: "2026-09-30", content: "主角每天早上买一罐咖啡、拍一张树影，日子几乎一模一样。可镜头里那些细小的变化，让重复看起来不像停滞，更像一种耐心的积攒。", tags: ["电影", "日常"], favorite: false, updatedAt: Date.now() - 2 * 86400000 },

        els.explorationList.innerHTML = state.explorations.map(function (item) {
          return '<div class="explore-item" data-explore-id="' + item.id + '"><span class="explore-bullet"></span><span class="explore-text" title="' + escapeHtml(item.text) + '">' + escapeHtml(item.text) + '</span><span class="explore-actions"><button class="explore-action" data-edit-explore="' + item.id + '" aria-label="编辑">编辑</button><button class="explore-action" data-delete-explore="' + item.id + '" aria-label="删除">删除</button></span></div>';
        }).join("");
      }
      function openExploration(id) {
        var item = id ? state.explorations.find(function (entry) { return entry.id === id; }) : null;
        state.editingExplorationId = item ? item.id : null;
        els.exploreModalTitle.textContent = item ? "编辑再想想" : "添加再想想";
        els.exploreInput.value = item ? item.text : "";
        els.exploreModal.classList.add("show"); els.exploreBackdrop.classList.add("show");
        setTimeout(function () { els.exploreInput.focus(); }, 120);
      }
      function closeExploration() { els.exploreModal.classList.remove("show"); els.exploreBackdrop.classList.remove("show"); state.editingExplorationId = null; }
      function submitExploration(event) {
        event.preventDefault();
        var text = els.exploreInput.value.trim();
        if (!text) return;
        if (state.editingExplorationId) {
          state.explorations = state.explorations.map(function (item) { return item.id === state.editingExplorationId ? Object.assign({}, item, { text: text, updatedAt: Date.now() }) : item; });
          showToast("再想想已更新");
        } else {
          state.explorations.unshift({ id: uid(), text: text, updatedAt: Date.now() });
          showToast("已加入再想想");
        }
        saveExplorations(); closeExploration(); renderExplorations();
      }
      function deleteExploration(id) {
        state.explorations = state.explorations.filter(function (item) { return item.id !== id; });
        saveExplorations(); renderExplorations(); showToast("再想想已删除");
      }
      function render() { renderStats(); renderCards(); renderFilters(); renderExplorations(); }
      function openEditor(id, preset) {
        state.editingId = id || null;
        var entry = id ? state.entries.find(function (e) { return e.id === id; }) : null;
        els.titleInput.value = entry ? entry.title : (preset && preset.title ? preset.title : "");
        els.categoryInput.value = entry ? entry.category : (preset && preset.category ? preset.category : "life");
        els.dateInput.value = entry ? entry.date : localDate();
        els.contentInput.value = entry ? entry.content : (preset && preset.content ? preset.content : "");
        els.tagsInput.value = entry && entry.tags ? entry.tags.join("，") : "";
        els.deleteBtn.style.display = entry ? "block" : "none";
        resetUndo(["title", "category", "date", "tags", "content"]);
        updateCharCount();
        els.editorModal.classList.add("show"); els.editorBackdrop.classList.add("show");
        setTimeout(function () { els.titleInput.focus(); els.titleInput.select(); }, 180);
      }
      function closeEditor() { els.editorModal.classList.remove("show"); els.editorBackdrop.classList.remove("show"); state.editingId = null; }
      function updateCharCount() { els.charCount.textContent = els.contentInput.value.length + " / 5000"; }
      var readingId = null;
      function openReader(id) {
        var entry = state.entries.find(function (e) { return e.id === id; });
        if (!entry) return;
        readingId = id;
        var c = categories[entry.category] || categories.life;
        els.readerCategory.innerHTML = "<i></i>" + c.name;
        els.readerCategory.style.setProperty("--category-color", c.color);
        els.readerDate.textContent = formatDate(entry.date, true);
        els.readerTitle.textContent = entry.title;
        els.readerTags.innerHTML = (entry.tags || []).slice(0, MAX_TAGS).map(function (tag) { return '<span class="tag">' + escapeHtml(tag) + "</span>"; }).join("");
        els.readerContent.innerHTML = String(entry.content).split(/\n{2,}/).map(function (block) {
          return "<p>" + escapeHtml(block).replace(/\n/g, "<br>") + "</p>";
        }).join("");
        updateReaderFavorite(entry.favorite);
        els.readerDrawer.classList.add("show"); els.drawerBackdrop.classList.add("show");
        els.readerDrawer.querySelector(".reader-body").scrollTop = 0;
      }
      function updateReaderFavorite(isFavorite) {
        els.readerFavorite.textContent = isFavorite ? "♥ 已收藏" : "♡ 收藏";
        els.readerFavorite.classList.toggle("on", !!isFavorite);
      }
      function closeReader() { els.readerDrawer.classList.remove("show"); els.drawerBackdrop.classList.remove("show"); readingId = null; }
      function submitEntry(event) {
        event.preventDefault();
        var title = els.titleInput.value.trim(), content = els.contentInput.value.trim();
        if (!title || !content) { showToast("标题和内容还需要写一点"); return; }
        var entry = { id: state.editingId || uid(), title: title, category: els.categoryInput.value, date: els.dateInput.value || localDate(), content: content, tags: els.tagsInput.value.split(/[,，、]/).map(function (x) { return x.trim(); }).filter(Boolean).slice(0, MAX_TAGS), favorite: false, updatedAt: Date.now() };
        var savedId = state.editingId;
        if (savedId) {
          var old = state.entries.find(function (e) { return e.id === savedId; });
          entry.favorite = old ? !!old.favorite : false;
          state.entries = state.entries.map(function (e) { return e.id === savedId ? entry : e; });
        } else {
          state.editingId = entry.id;
          els.deleteBtn.style.display = "block";
          state.entries.unshift(entry);
        }
        save(); render(); showToast("已保存，可以接着写");
      }
      function toggleFavorite(id) {
        state.entries = state.entries.map(function (e) { return e.id === id ? Object.assign({}, e, { favorite: !e.favorite, updatedAt: Date.now() }) : e; });
        save(); render();
        var updated = state.entries.find(function (e) { return e.id === id; });
        if (readingId === id) updateReaderFavorite(updated.favorite);
        showToast(updated.favorite ? "已加入收藏" : "已取消收藏");
      }
      function deleteEntry() {
        if (!state.editingId) return;
        var entry = state.entries.find(function (e) { return e.id === state.editingId; });
        if (!entry || !window.confirm("确定删除「" + entry.title + "」吗？")) return;
        state.entries = state.entries.filter(function (e) { return e.id !== state.editingId; }); save(); closeEditor(); render(); showToast("记录已删除");
      }
      function deleteFromReader() {
        if (!readingId) return;
        var entry = state.entries.find(function (e) { return e.id === readingId; });
        if (!entry || !window.confirm("确定删除「" + entry.title + "」吗？")) return;
        state.entries = state.entries.filter(function (e) { return e.id !== readingId; }); save(); closeReader(); render(); showToast("记录已删除");
      }
      function setView(view) { state.view = view; state.filter = view; render(); }
      function showToast(message) { els.toast.textContent = message; els.toast.classList.add("show"); clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(function () { els.toast.classList.remove("show"); }, 2200); }
      var undo = { fields: {}, stacks: {}, prev: {}, lastAt: {}, lastKey: null };
      function trackUndo(key, el) {
        undo.fields[key] = el;
        undo.stacks[key] = [];
        undo.prev[key] = el.value;
        undo.lastAt[key] = 0;
        el.addEventListener("input", function () {
          var now = Date.now();
          if (now - undo.lastAt[key] > 600) {
            undo.stacks[key].push(undo.prev[key]);
            if (undo.stacks[key].length > 120) undo.stacks[key].shift();
          }
          undo.lastAt[key] = now;
          undo.prev[key] = el.value;
          undo.lastKey = key;
        });
        el.addEventListener("focus", function () { undo.lastKey = key; });
      }
      function resetUndo(keys) {
        keys.forEach(function (key) {
          if (!undo.fields[key]) return;
          undo.prev[key] = undo.fields[key].value;
          undo.stacks[key] = [];
          undo.lastAt[key] = 0;
        });
        undo.lastKey = null;
      }
      function undoKeyFor(target) {
        for (var key in undo.fields) { if (undo.fields[key] === target) return key; }
        return null;
      }
      function applyUndo(key) {
        var el = undo.fields[key], stack = undo.stacks[key];
        if (!el || !stack || !stack.length) return;
        var value = stack.pop();
        el.value = value;
        undo.prev[key] = value;
        undo.lastAt[key] = Date.now();
        if (el === els.contentInput) updateCharCount();
        el.focus();
        try { el.setSelectionRange(value.length, value.length); } catch (err) { }
        showToast("已撤销上一步输入");
      }
      function handleUndo(event) {
        if (!(event.metaKey || event.ctrlKey) || event.shiftKey || event.key.toLowerCase() !== "z") return;
        var key = undoKeyFor(event.target) || undo.lastKey;
        if (!key || !undo.stacks[key] || !undo.stacks[key].length) return;
        event.preventDefault();
        applyUndo(key);
      }
      function bindEvents() {
        els.filters.addEventListener("click", function (e) { var button = e.target.closest(".filter-chip"); if (!button) return; setView(button.dataset.filter); });
        els.sortSelect.addEventListener("change", function () { state.sort = els.sortSelect.value; renderCards(); });
        els.searchInput.addEventListener("input", function () { state.search = els.searchInput.value; renderCards(); });
        els.newEntryBtn.addEventListener("click", function () { openEditor(); });
        els.readerClose.addEventListener("click", closeReader);
        els.drawerBackdrop.addEventListener("click", closeReader);
        els.readerEdit.addEventListener("click", function () { var id = readingId; closeReader(); openEditor(id); });
        els.readerDelete.addEventListener("click", deleteFromReader);
        els.readerFavorite.addEventListener("click", function () { if (readingId) toggleFavorite(readingId); });
        els.editorClose.addEventListener("click", closeEditor);
        els.editorBackdrop.addEventListener("click", closeEditor);
        els.entryForm.addEventListener("submit", submitEntry); els.deleteBtn.addEventListener("click", deleteEntry);
        els.contentInput.addEventListener("input", updateCharCount);
        ["title", "category", "date", "tags", "content"].forEach(function (key) { trackUndo(key, els[{ title: "titleInput", category: "categoryInput", date: "dateInput", tags: "tagsInput", content: "contentInput" }[key]]); });
        els.addExplorationBtn.addEventListener("click", function () { openExploration(); });
        els.exploreClose.addEventListener("click", closeExploration); els.exploreBackdrop.addEventListener("click", closeExploration); els.exploreForm.addEventListener("submit", submitExploration);
        els.explorationList.addEventListener("click", function (e) {
          var edit = e.target.closest("[data-edit-explore]"), del = e.target.closest("[data-delete-explore]");
          if (edit) openExploration(edit.dataset.editExplore);
          if (del) deleteExploration(del.dataset.deleteExplore);
        });
        els.themeToggle.addEventListener("click", function () { var dark = document.documentElement.dataset.theme === "dark"; document.documentElement.dataset.theme = dark ? "light" : "dark"; localStorage.setItem(THEME_KEY, dark ? "light" : "dark"); els.themeToggle.textContent = dark ? "☾" : "☀"; });
        els.accountBtn.addEventListener("click", async function () {
          if (!cloud.user) { openAuth(); return; }
          if (window.confirm("退出登录后，这台电脑仍会保留本地记录。确定退出吗？")) await cloud.client.auth.signOut();
        });
        els.authClose.addEventListener("click", closeAuth); els.authBackdrop.addEventListener("click", closeAuth);
        els.authForm.addEventListener("submit", submitAuth); els.authSignUp.addEventListener("click", signUpAuth);
        document.addEventListener("keydown", function (e) { handleUndo(e); if (e.key === "Escape") { closeEditor(); closeReader(); closeExploration(); closeAuth(); } if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); els.searchInput.focus(); } if (!e.target.matches("input,textarea,select") && e.key.toLowerCase() === "n") openEditor(); });
      }
      async function init() {
        setupElements(); setupCategories(); await load(); currentDateInfo();
        var theme = localStorage.getItem(THEME_KEY) || "light"; document.documentElement.dataset.theme = theme; els.themeToggle.textContent = theme === "dark" ? "☀" : "☾";
        bindEvents(); render(); initCloud();
      }
      init();
    }());
  </script>
</body>
</html>
